name: Test Firebase Security Rules

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase rule-test dependencies
        run: npm install
      - name: Compile Cloud Functions TypeScript
        run: npm run build:functions
      - name: Run Firestore and Storage emulator tests
        run: npm run test:rules
