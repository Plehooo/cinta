name: Build Galeri Cinta APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Firebase app (optional until secrets are added)
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
            echo "Firebase configuration loaded from repository secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not configured; the APK will show the Firebase setup screen."
          fi
      - name: Configure Supabase widget image service (optional)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            {
              printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
              printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            } > supabase.properties
            echo "Supabase public client configuration loaded."
          else
            echo "::warning::Supabase Variables are not configured; photo-to-partner widget upload will remain unavailable."
          fi
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon assembleDebug testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: galeri-cinta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
